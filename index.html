<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Berrinche · Panel de facturación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg: #FBFAF6; --card: #ffffff; --border: #e0dfd2;
  --text-primary: #3c342c; --text-secondary: #6b6360; --text-muted: #b3aead;
  
  /* Paleta principal ajustada */
  --brand: #1cacc4; --brand-soft: #E3F4F6;
  --success: #3ea414; --success-soft: #E3F5EC;
  --warning: #f87f0c; --warning-soft: #FFF2E5;
  --danger: #fb4b53; --danger-soft: #FBE4E4;
  --yellow: #dbc425; --lime: #9ca91e; --brown: #3c342c;

  --gap: 14px; --radius: 12px; --radius-sm: 8px;
  --shadow-sm: 0 2px 8px rgba(60, 52, 44, .06);
  --font-head: 'Work Sans', sans-serif; --font-body: 'Inter', sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text-primary);font-family:var(--font-body);font-size:14px;line-height:1.5;padding-bottom:50px;}

.header{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);padding:12px 16px;}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.logo-wrap{display:flex;align-items:center;gap:8px;}
.logo-wrap img{height:22px;display:block;}
.sync-status{font-size:11px;color:var(--text-muted);font-weight:500;}
.header-controls{display:flex;gap:8px;}
.btn-primary{background:var(--brand);color:#fff;border:none;padding:8px 12px;border-radius:var(--radius-sm);font-weight:700;font-family:var(--font-head);font-size:12px;cursor:pointer;}
.header-bottom{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.header-bottom select, .header-bottom input {flex:1;min-width:130px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;}
.header-bottom select:focus, .header-bottom input:focus {border-color:var(--brand);}

.main{padding:16px;max-width:920px;margin:0 auto;}

.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--gap);margin-bottom:var(--gap);}
.kpi-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--kpi-color, var(--brand));}
.kpi-label{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--text-secondary);display:block;margin-bottom:4px;}
.kpi-value{font-family:var(--font-head);font-size:20px;font-weight:800;color:var(--kpi-color);line-height:1.1;}

.charts-grid{display:grid;grid-template-columns:1fr;gap:var(--gap);margin-bottom:24px;}
@media(min-width:640px){
  .charts-grid{grid-template-columns:1.5fr 1fr;}
  .kpi-grid{grid-template-columns:repeat(4,1fr);}
}
.chart-card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm);}
.chart-card h3{font-family:var(--font-head);font-size:13px;font-weight:700;text-transform:uppercase;color:var(--text-secondary);margin-bottom:12px;}
.chart-wrap{position:relative;height:200px;}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;}

.group-section{margin-bottom:20px;}
.group-header{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--brand-soft);border-radius:var(--radius-sm);margin-bottom:10px;}
.group-name{font-family:var(--font-head);font-size:13px;font-weight:800;text-transform:uppercase;color:var(--brand);}
.group-totals{font-family:var(--font-head);font-size:14px;font-weight:700;color:var(--brand);}

.client-item{background:var(--card);border-radius:var(--radius-sm);margin-bottom:8px;box-shadow:var(--shadow-sm);border:1px solid var(--border);}
.client-top{display:flex;justify-content:space-between;padding:12px 14px 8px;}
.client-name{font-family:var(--font-head);font-size:14px;font-weight:700;color:var(--text-primary);}
.client-meta{font-size:11px;color:var(--text-muted);}
.client-controls{display:flex;align-items:center;gap:6px;padding:0 14px 10px;flex-wrap:wrap;}
.budget-input{width:80px;padding:6px;font-size:13px;font-weight:700;border:1px solid var(--border);border-radius:4px;text-align:right;}
.field-select{padding:6px;font-size:12px;border:1px solid var(--border);border-radius:4px;background:var(--bg);}
.status-btn{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;border:none;cursor:pointer;font-family:var(--font-head);}
.status-btn.pagado{background:var(--success-soft);color:var(--success);}
.status-btn.pendiente{background:var(--warning-soft);color:var(--warning);}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--brown);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:9998;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.loading-overlay{position:fixed;inset:0;background:rgba(251,250,246,.9);display:none;justify-content:center;align-items:center;z-index:9999;font-weight:700;color:var(--brand);}
</style>
</head>
<body>

<div class="loading-overlay" id="loadingView">Sincronizando...</div>
<div class="toast" id="toast"></div>
<datalist id="available-tags"></datalist>

<header class="header">
  <div class="header-top">
    <div class="logo-wrap">
      <span style="font-family:var(--font-head);font-weight:800;font-size:18px;color:var(--text-primary)">Berrinche.</span>
      <span class="sync-status" id="sync-status"></span>
    </div>
    <div class="header-controls">
      <button class="btn-primary" onclick="loadDataFromSheet(true)">🔄 Sync</button>
      <button class="btn-primary" onclick="rolloverMonth()" style="background:var(--brown);">Copiar mes ➔</button>
    </div>
  </div>
  <div class="header-bottom">
    <select id="view-month" onchange="renderDashboard()"></select>
    <select id="group-by" onchange="renderDashboard()">
      <option value="tier">Agrupar por Tier</option>
      <option value="platform">Agrupar por Plataforma</option>
      <option value="status">Agrupar por Estado</option>
      <option value="tag">Agrupar por Grupo/Tag</option>
    </select>
    <input type="text" id="search-input" oninput="renderDashboard()" placeholder="Buscar cliente...">
  </div>
</header>

<div class="main">
  <div class="kpi-grid">
    <div class="kpi-card" style="--kpi-color:var(--brand);"><span class="kpi-label">Facturación</span><span class="kpi-value" id="kpi-total">$0</span></div>
    <div class="kpi-card" style="--kpi-color:var(--success);"><span class="kpi-label">Cobrado</span><span class="kpi-value" id="kpi-cobrado">$0</span></div>
    <div class="kpi-card" style="--kpi-color:var(--warning);"><span class="kpi-label">Pendiente</span><span class="kpi-value" id="kpi-pendiente">$0</span></div>
    <div class="kpi-card" style="--kpi-color:var(--brown);"><span class="kpi-label">Ítems listados</span><span class="kpi-value" id="kpi-cuentas">0</span></div>
  </div>

  <div class="charts-grid">
    <div class="chart-card"><h3>Evolución Anual</h3><div class="chart-wrap"><canvas id="historyChart"></canvas></div></div>
    <div class="chart-card"><h3>Distribución</h3><div class="chart-wrap"><canvas id="donutChart"></canvas><div class="donut-center" id="donut-total" style="font-family:var(--font-head);font-weight:800;font-size:18px;">$0</div></div></div>
  </div>

  <div id="groups-container"></div>
  
  <div class="chart-card" style="margin-top:24px;">
    <h3>➕ Nuevo Ítem Rápido</h3>
    <form onsubmit="addClient(event)" style="display:flex;gap:8px;flex-wrap:wrap;">
      <input type="text" id="form-name" required placeholder="Cliente" class="budget-input" style="flex:1;text-align:left;">
      <input type="number" id="form-budget" required placeholder="Presupuesto" class="budget-input">
      <select id="form-tier" class="field-select"><option value="Grande">Grande</option><option value="Mediana" selected>Mediana</option><option value="Chica">Chica</option></select>
      <button type="submit" class="btn-primary">Agregar</button>
    </form>
  </div>
</div>

<script>
const CONFIG = {
  sheetApiUrl: "TU_URL_DE_APPS_SCRIPT_AQUI", // <--- REEMPLAZAR
  chartColors: ['#1cacc4', '#3ea414', '#f87f0c', '#fb4b53', '#dbc425', '#9ca91e', '#3c342c'],
  meses: ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"]
};

let rawClients = [], visibleClients = [];
let historyChart, donutChart;

function getMonthLabel(m) {
  if (!m || !m.includes('-')) return m;
  const [y, mm] = m.split('-');
  return `${CONFIG.meses[parseInt(mm, 10)-1]} ${y}`;
}
function parseCleanMonth(raw) {
  let s = (raw||"").toString().trim();
  if (/^\d{4}-\d{2}$/.test(s)) return s;
  let d = new Date(raw);
  return !isNaN(d) ? d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, '0') : s;
}
function formatMoney(n) { return '$' + (n || 0).toLocaleString('es-AR'); }

function getTimelineArray() {
  let set = new Set();
  for(let i=1; i<=12; i++) set.add("2026-" + String(i).padStart(2, '0')); // Todo 2026 forzado
  rawClients.forEach(c => { const m = parseCleanMonth(c.month); if(m) set.add(m); });
  return Array.from(set).sort();
}

async function loadDataFromSheet(force = false) {
  document.getElementById('loadingView').style.display = 'flex';
  try {
    const res = await fetch(CONFIG.sheetApiUrl);
    rawClients = await res.json();
    initMonths();
    renderDashboard();
    document.getElementById('sync-status').textContent = new Date().toLocaleTimeString();
  } catch(e) { showToast("Error de conexión", true); }
  document.getElementById('loadingView').style.display = 'none';
}

async function syncPost(payload) {
  try {
    const res = await fetch(CONFIG.sheetApiUrl, { method: "POST", body: JSON.stringify(payload) });
    return res.ok;
  } catch(e) { fetch(CONFIG.sheetApiUrl, { method: "POST", mode: "no-cors", body: JSON.stringify(payload) }); return true; }
}

function initMonths() {
  const sel = document.getElementById('view-month');
  const oldVal = sel.value || ("2026-" + String(new Date().getMonth()+1).padStart(2,'0'));
  sel.innerHTML = `<option value="Todos">Vista Anual Completa</option>`;
  getTimelineArray().forEach(m => sel.innerHTML += `<option value="${m}" ${m===oldVal?'selected':''}>${getMonthLabel(m)}</option>`);
}

function renderDashboard() {
  const month = document.getElementById('view-month').value;
  const groupBy = document.getElementById('group-by').value;
  const query = document.getElementById('search-input').value.toLowerCase();
  
  visibleClients = rawClients.filter(c => month === "Todos" || parseCleanMonth(c.month) === month)
                             .filter(c => [c.name, c.tag, c.platform].join(' ').toLowerCase().includes(query));

  let groups = {}, totalFact = 0, totalCob = 0, totalPend = 0;
  
  document.getElementById('available-tags').innerHTML = Array.from(new Set(rawClients.map(c=>c.tag).filter(Boolean))).map(t=>`<option value="${t}">`).join('');

  visibleClients.forEach(c => {
    let gVal = c[groupBy];
    if (!gVal || gVal.trim()==="") gVal = "Sin Asignar";
    if (groupBy==='tag' && gVal==="Sin Asignar") gVal = "Sin Grupo";
    
    if (!groups[gVal]) groups[gVal] = { total: 0, items: [] };
    
    const b = parseFloat(c.budget)||0;
    groups[gVal].total += b;
    groups[gVal].items.push(c);
    
    totalFact += b;
    if ((c.status||"").toLowerCase()==="pagado") totalCob += b; else totalPend += b;
  });

  // Render KPIs
  document.getElementById('kpi-total').innerText = formatMoney(totalFact);
  document.getElementById('kpi-cobrado').innerText = formatMoney(totalCob);
  document.getElementById('kpi-pendiente').innerText = formatMoney(totalPend);
  document.getElementById('kpi-cuentas').innerText = visibleClients.length;
  document.getElementById('donut-total').innerText = formatMoney(totalFact);

  // Render Groups & Clients
  const container = document.getElementById('groups-container');
  container.innerHTML = "";
  
  Object.keys(groups).sort((a,b) => groups[b].total - groups[a].total).forEach((gName, idx) => {
    const cColor = CONFIG.chartColors[idx % CONFIG.chartColors.length];
    let html = `<div class="group-section"><div class="group-header" style="border-left:5px solid ${cColor}">
                <span class="group-name" style="color:${cColor}">${gName} <small style="color:var(--text-secondary)">(${groups[gName].items.length})</small></span>
                <span class="group-totals" style="color:${cColor}">${formatMoney(groups[gName].total)}</span></div>`;
    
    groups[gName].items.forEach(c => {
      html += `
      <div class="client-item">
        <div class="client-top">
          <div><div class="client-name">${c.name}</div><div class="client-meta">${getMonthLabel(c.month)} · ${c.platform||'Sin plat.'}</div></div>
          <div>
            <button class="status-btn ${(c.status||"pendiente").toLowerCase()}" onclick="updateField('${c.id}','status','${c.status==="Pagado"?"Pendiente":"Pagado"}')">${c.status}</button>
            <button class="status-btn" style="background:var(--danger-soft);color:var(--danger);" onclick="deleteItem('${c.id}')">×</button>
          </div>
        </div>
        <div class="client-controls">
          $ <input type="number" class="budget-input" value="${c.budget}" onchange="updateField('${c.id}','budget',this.value)">
          <input type="text" class="field-select" value="${c.tag||''}" list="available-tags" placeholder="Tag/Grupo" onchange="updateField('${c.id}','tag',this.value)">
          <select class="field-select" onchange="updateField('${c.id}','tier',this.value)">
            <option value="Grande" ${c.tier==='Grande'?'selected':''}>Grande</option><option value="Mediana" ${c.tier==='Mediana'?'selected':''}>Mediana</option><option value="Chica" ${c.tier==='Chica'?'selected':''}>Chica</option>
          </select>
        </div>
      </div>`;
    });
    container.innerHTML += html + "</div>";
  });

  updateCharts(groups);
}

function updateCharts(groups) {
  // Donut Chart
  const dCtx = document.getElementById('donutChart').getContext('2d');
  const gKeys = Object.keys(groups);
  const dData = gKeys.map(k => groups[k].total);
  if(donutChart) { donutChart.data.labels = gKeys; donutChart.data.datasets[0].data = dData; donutChart.update(); }
  else {
    donutChart = new Chart(dCtx, {
      type: 'doughnut', data: { labels: gKeys, datasets: [{ data: dData, backgroundColor: CONFIG.chartColors, borderWidth:0 }] },
      options: { responsive:true, maintainAspectRatio:false, cutout:'75%', plugins: { legend: { position: 'right', labels: { boxWidth: 10, font:{size:11} } } } }
    });
  }

  // History Bar Chart (Agrupado por mes todo el año)
  const hCtx = document.getElementById('historyChart').getContext('2d');
  const months = getTimelineArray();
  const cobData = months.map(m => rawClients.filter(c => parseCleanMonth(c.month)===m && (c.status||"").toLowerCase()==="pagado").reduce((s,c)=>s+(Number(c.budget)||0),0));
  const penData = months.map(m => rawClients.filter(c => parseCleanMonth(c.month)===m && (c.status||"").toLowerCase()!=="pagado").reduce((s,c)=>s+(Number(c.budget)||0),0));
  
  if(historyChart) { historyChart.data.labels = months.map(getMonthLabel); historyChart.data.datasets[0].data = cobData; historyChart.data.datasets[1].data = penData; historyChart.update(); }
  else {
    historyChart = new Chart(hCtx, {
      type: 'bar', data: { labels: months.map(getMonthLabel), datasets: [
        { label: 'Cobrado', data: cobData, backgroundColor: '#3ea414', stack: 's' },
        { label: 'Pendiente', data: penData, backgroundColor: '#fb4b53', stack: 's' }
      ]},
      options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{display:false} }, scales: { x: { stacked: true, ticks:{font:{size:10}} }, y: { stacked: true, ticks:{font:{size:10}} } } }
    });
  }
}

// Acciones CRUD
async function updateField(id, field, val) {
  const idx = rawClients.findIndex(c => c.id.toString() === id.toString());
  if (idx === -1) return;
  rawClients[idx][field] = field === 'budget' ? Number(val) : val;
  renderDashboard();
  const ok = await syncPost({ action: "update", id: id, [field]: rawClients[idx][field] });
  showToast(ok ? "Guardado" : "Error al guardar en Sheets", !ok);
}

async function deleteItem(id) {
  if(!confirm("¿Eliminar este ítem?")) return;
  rawClients = rawClients.filter(c => c.id.toString() !== id.toString());
  renderDashboard();
  await syncPost({ action: "delete", id });
}

async function addClient(e) {
  e.preventDefault();
  const month = document.getElementById('view-month').value === "Todos" ? ("2026-" + String(new Date().getMonth()+1).padStart(2,'0')) : document.getElementById('view-month').value;
  const item = { action: "add", id: Date.now(), name: document.getElementById('form-name').value, budget: document.getElementById('form-budget').value, tier: document.getElementById('form-tier').value, month: month, status: "Pendiente", tag: "" };
  rawClients.push(item);
  renderDashboard();
  e.target.reset();
  await syncPost(item);
}

// Funcionalidad Estrella: Arrastrar al mes siguiente en bloque
async function rolloverMonth() {
  const curr = document.getElementById('view-month').value;
  if(curr === "Todos") return showToast("Seleccioná un mes específico arriba para poder copiarlo", true);
  
  const [y, m] = curr.split('-');
  const nextDate = new Date(y, Number(m), 1);
  const nextMonth = nextDate.getFullYear() + "-" + String(nextDate.getMonth()+1).padStart(2,'0');
  
  if(!visibleClients.length) return showToast("No hay clientes visibles para copiar", true);
  
  let newItems = [];
  visibleClients.forEach(c => {
    if (!rawClients.some(x => x.name === c.name && parseCleanMonth(x.month) === nextMonth)) {
      newItems.push({ ...c, id: Date.now() + Math.floor(Math.random()*1000), month: nextMonth, status: "Pendiente" });
    }
  });

  if (!newItems.length) return showToast(`Todos los clientes ya estaban en ${getMonthLabel(nextMonth)}`);
  
  rawClients.push(...newItems);
  document.getElementById('view-month').value = nextMonth;
  initMonths();
  renderDashboard();
  
  showToast(`Copiando ${newItems.length} clientes a ${getMonthLabel(nextMonth)}...`);
  const payloadItems = newItems.map(x => { let z = {...x}; delete z.action; return z; });
  await syncPost({ action: "batch_add", items: payloadItems });
  showToast("Clientes copiados correctamente.");
}

function showToast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = err ? "var(--danger)" : "var(--brown)";
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

window.onload = loadDataFromSheet;
</script>
</body>
</html>
